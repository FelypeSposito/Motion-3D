<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motion 3D — QA (semente fixa)</title>
<base href="/">
<script>
  // QA visual: Math.random com semente fixa ANTES de qualquer módulo do site rodar.
  // O prado usa Math.random em grama, taboas, cores de flores e lótus — sem isto cada carregamento muda o capim
  // e a comparação antes/depois acusa diferença onde não houve mudança. Semente: ?seed=N (padrão 1).
  (() => {
    let a = (+new URLSearchParams(location.search).get("seed") || 1) >>> 0;
    Math.random = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  })();
  // Sem recarga automática do Vite: outros agentes editam src/ e o "page reload" do HMR mataria uma série no meio.
  // O socket HMR (protocolo "vite-hmr") vira um objeto mudo. Recarregue a página à mão quando quiser o código novo.
  (() => {
    const WS = window.WebSocket;
    window.WebSocket = function (url, proto) {
      if (String(proto).includes("vite-hmr")) return Object.assign(new EventTarget(), { readyState: 0, send() {}, close() {} });
      return new WS(url, proto);
    };
    window.WebSocket.prototype = WS.prototype; Object.assign(window.WebSocket, { OPEN: 1, CLOSED: 3, CONNECTING: 0, CLOSING: 2 });
  })();
</script>
</head>
<body>
<script type="module">
  // monta a mesma página do index.html (lida em tempo real, então acompanha mudanças nele) e importa os módulos dele
  const html = await (await fetch("/index.html")).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.head.querySelectorAll('link[rel="stylesheet"]').forEach((l) => document.head.append(l.cloneNode()));
  const mods = [];
  for (const el of [...doc.body.children]) {
    if (el.tagName === "SCRIPT") { if (el.type === "module" && el.src) mods.push(new URL(el.getAttribute("src"), location.origin + "/").pathname); continue; }
    document.body.append(document.importNode(el, true));
  }
  for (const m of mods) if (!m.startsWith("/@vite")) await import(/* @vite-ignore */ m);
</script>
</body>
</html>
