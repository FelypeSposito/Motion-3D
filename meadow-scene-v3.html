<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meadow Fog v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* v2 — névoa dourada em contraluz
   névoa #E8C296 · sol #F9D56B · arenito #E8D3A3 · sálvia #B8C5A0
   prado #7A9E5A · musgo #2D5016 · lagoa #1E3A34 · coral #FFA633 · lótus #F2A7B5 */
:root{--ink:#2a2418;--cream:#f3e3c4;--sun:#f9d56b;--white:#fff8ea;--ease:cubic-bezier(.65,.05,0,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:'Instrument Sans',sans-serif;cursor:none}
canvas{position:fixed;inset:0;display:block}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.mask{overflow:hidden;display:block}.mask>span{display:block}
a,button{color:inherit;font:inherit;background:none;border:0;text-decoration:none;cursor:none}

.cursor{position:fixed;top:0;left:0;width:36px;height:36px;margin:-18px 0 0 -18px;border:1.5px solid var(--white);border-radius:50%;pointer-events:none;z-index:100;mix-blend-mode:difference;transition:width .4s var(--ease),height .4s var(--ease),margin .4s var(--ease)}
.cursor.big{width:70px;height:70px;margin:-35px 0 0 -35px}

#intro{position:fixed;inset:0;background:var(--cream);z-index:60;display:grid;place-items:center;text-align:center}
#letter{font-size:3rem;height:4rem;line-height:4rem}
.sunrise{display:none;width:80px;height:4rem;margin:0 auto;position:relative;overflow:hidden;border-bottom:2px solid var(--ink)}
.sunrise i{position:absolute;left:50%;bottom:0;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:radial-gradient(circle,#ffe7a3,#f9b54b);transform:translateY(100%)}
#intro h6{font-size:.75rem;font-weight:500;letter-spacing:.04em;margin:1.2rem 0 .5rem}
#intro p{font-size:.72rem;max-width:34ch;line-height:1.35;opacity:.75}
#enter{margin-top:1.6rem;padding:.55rem 1.3rem;border-radius:2rem;background:var(--ink);color:var(--cream);font-size:.8rem;opacity:0}
#status{margin-top:.8rem;font-size:.65rem;opacity:.5}

.ui{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0}
.ui>*{pointer-events:auto}
header{position:absolute;top:1.6rem;left:2rem;right:2rem;display:flex;justify-content:space-between;align-items:center;color:var(--white)}
.logo{font-size:1.9rem;letter-spacing:-.04em}
.logo sup{font-size:.6rem}
nav{display:flex;align-items:center;gap:1.6rem;font-size:1.15rem}
nav a{position:relative}
nav a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .6s var(--ease)}
nav a:hover::after{transform:scaleX(1);transform-origin:left}
.dot{width:46px;height:46px;border-radius:50%;background:var(--white);color:var(--ink);display:grid;place-items:center;font-size:.9rem;letter-spacing:2px;transition:transform .6s var(--ease)}
.dot:hover{transform:scale(1.15)}
.hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-58%);text-align:center;pointer-events:none;color:var(--white);text-shadow:0 2px 40px #5a3a1a55}
.hero small{display:block;font-size:clamp(.7rem,1.1vw,1.05rem);letter-spacing:-.02em;margin-bottom:.4rem}
.hero h1{font-weight:500;line-height:.86;letter-spacing:-.05em}
.hero h1 .serif{font-size:clamp(3rem,8vw,7.4rem);letter-spacing:-.03em}
.hero h1 .sans{font-size:clamp(3.4rem,9.4vw,8.8rem)}
.cta{pointer-events:auto;display:inline-flex;gap:.5rem;margin-top:2rem;padding:.6rem 1.4rem;border-radius:2rem;background:var(--white);color:var(--ink);text-shadow:none;font-size:.95rem;transition:transform .6s var(--ease),background .4s}
.cta:hover{transform:scale(1.06);background:var(--sun)}
footer{position:absolute;bottom:1.6rem;left:2rem;right:2rem;display:flex;justify-content:space-between;align-items:center}
footer .l{display:flex;gap:1.3rem;align-items:center}
.pill{padding:.6rem 1.4rem;border:1.5px solid var(--white);border-radius:2rem;color:var(--white);font-size:1rem;transition:background .5s,color .5s}
.pill:hover{background:var(--white);color:var(--ink)}
.palette{display:flex;gap:6px;align-items:center}
.palette span{width:22px;height:22px;border-radius:50%;border:1.5px solid #fff8eaaa;position:relative;transition:transform .5s var(--ease)}
.palette span:hover{transform:translateY(-6px) scale(1.25)}
.palette span::after{content:attr(data-hex);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--white);opacity:0;transition:opacity .3s;white-space:nowrap}
.palette span:hover::after{opacity:1}
@media (max-width:700px){nav a{display:none}header,footer{left:1rem;right:1rem}.pill,.palette{display:none}}
</style>
</head>
<body>

<div class="cursor"></div>

<div id="intro"><div>
  <div id="letter">B</div>
  <div class="sunrise" id="sunrise"><i></i></div>
  <h6>MEADOW STUDIO®</h6>
  <p>Um estúdio de marca, digital e motion cultivando ideias que crescem devagar e duram muito.</p>
  <button id="enter">Entrar ↘</button>
  <div id="status">cultivando a cena…</div>
</div></div>

<div class="ui">
  <header>
    <div class="logo">meadow<span class="serif">studio</span><sup>®</sup></div>
    <nav><a href="#">Index</a><a href="#">Projetos</a><a href="#">Contato</a><button class="dot">••</button></nav>
  </header>
  <div class="hero">
    <small class="mask"><span>UM ESTÚDIO DE MARCA, DIGITAL & MOTION</span></small>
    <h1><span class="mask"><span class="serif">Onde as ideias</span></span><span class="mask"><span class="sans">florescem</span></span></h1>
    <a class="cta" href="#">Ver projetos <span>↘</span></a>
  </div>
  <footer>
    <div class="l"><button class="dot">✿</button><a class="pill" href="#">Nosso 2025</a></div>
    <div class="palette" id="palette"></div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { Reflector } from "three/addons/objects/Reflector.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

const C = { fog: "#f2c08c", sun: "#f9d56b", stone: "#e8d3a3", sage: "#b8c5a0", meadow: "#7a9e5a", moss: "#2d5016", pond: "#17524a", coral: "#ffa633", blossom: "#f2a7b5" };
document.getElementById("palette").innerHTML = Object.entries(C).map(([, v]) => `<span data-hex="${v}" style="background:${v}"></span>`).join("");

// =====================================================================
// RUÍDO — comum e periódico (texturas que repetem sem emenda)
// =====================================================================
const hash = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
const lerpN = (a, b, c, d, u, v) => a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
const noise = (x, y) => {
  const i = Math.floor(x), j = Math.floor(y), f = x - i, g = y - j;
  return lerpN(hash(i, j), hash(i + 1, j), hash(i, j + 1), hash(i + 1, j + 1), f * f * (3 - 2 * f), g * g * (3 - 2 * g));
};
const fbm = (x, y, o = 5) => { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f); n += a; f *= 2.03; a *= .5; } return s / n; };
const ridged = (x, y) => { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < 5; i++) { const r = 1 - Math.abs(noise(x * f, y * f) * 2 - 1); s += a * r * r; n += a; f *= 2.1; a *= .5; } return s / n; };
const md = (i, p) => ((i % p) + p) % p;
const pnoise = (x, y, px, py) => {
  const i = Math.floor(x), j = Math.floor(y), f = x - i, g = y - j;
  return lerpN(hash(md(i, px), md(j, py)), hash(md(i + 1, px), md(j, py)), hash(md(i, px), md(j + 1, py)), hash(md(i + 1, px), md(j + 1, py)), f * f * (3 - 2 * f), g * g * (3 - 2 * g));
};
const pfbm = (x, y, px, py, o = 4) => { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * pnoise(x * f, y * f, px * f, py * f); n += a; f *= 2; a *= .5; } return s / n; };
const smooth = (e0, e1, x) => { const t = Math.min(Math.max((x - e0) / (e1 - e0), 0), 1); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const ISL = { cx: 1, cz: -6, rx: 15, rz: 10 };
function H(x, z) {
  const dx = (x - ISL.cx) / ISL.rx, dz = (z - ISL.cz) / ISL.rz;
  const d = Math.hypot(dx, dz) + (fbm(x * .12 + 7, z * .12) - .5) * .45;
  const isl = smooth(1, .42, d);
  const h = -1.4 + isl * (1.55 + fbm(x * .08, z * .08) * 1.5) + isl * (fbm(x * .5, z * .5) - .5) * .22;
  const r = Math.hypot(x / 1.15, z + 12);
  const ring = smooth(32, 48, r) * smooth(74, 60, r) * smooth(8, -10, z);
  return Math.max(h, -1.4 + ring * (1.5 + Math.pow(fbm(x * .035 + 3, z * .035), 1.6) * 16 + fbm(x * .15, z * .15) * 2.2));
}
const M = (x, z) => -2 + smooth(-92, -170, z) * (ridged(x * .009 + 5, z * .009) * 75 + fbm(x * .03, z * .03) * 10) * (.6 + .4 * smooth(250, 40, Math.abs(x)));
const slope = (f, x, z) => Math.hypot(f(x + .5, z) - f(x - .5, z), f(x, z + .5) - f(x, z - .5));

// =====================================================================
// NÉVOA DENSA: começa a 10u da câmera, mais grossa perto do chão,
// e incandesce na direção do sol (HDR → alimenta bloom e god rays)
// =====================================================================
const SUN_DIR = new THREE.Vector3(.25, .045, -1).normalize();
const sd = SUN_DIR.toArray().map(v => v.toFixed(4)).join(",");
const FOG_GLSL = `
  float fogDist = length(fogD);
  float fogH = exp(-max(fogY + .5, 0.) * .07);
  float fogF = 1. - exp(-max(fogDist - 10., 0.) * fogDensity * (.25 + fogH));
  float fogS = pow(max(dot(fogD / fogDist, vec3(${sd})), 0.), 5.);
  vec3 fogC = mix(fogColor, vec3(1.15, .78, .42), fogS);
  fogOut = mix(fogIn, fogC, clamp(fogF, 0., 1.));`;
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
 varying vec3 vFogWorld;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
 vec4 fogW = vec4(transformed, 1.0);
 #ifdef USE_INSTANCING
  fogW = instanceMatrix * fogW;
 #endif
 vFogWorld = (modelMatrix * fogW).xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
 uniform vec3 fogColor; uniform float fogDensity; varying vec3 vFogWorld;
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
 vec3 fogD = vFogWorld - cameraPosition; float fogY = vFogWorld.y; vec3 fogIn = gl_FragColor.rgb; vec3 fogOut;
 ${FOG_GLSL}
 gl_FragColor.rgb = fogOut;
#endif`;

// =====================================================================
// RENDERER / CENA / LUZ EM CONTRALUZ
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
const DPR = Math.min(devicePixelRatio, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .9;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(C.fog, .03);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 2500);
camera.position.set(0, 2.7, 30);
const U = { time: { value: 0 }, sunView: { value: new THREE.Vector3() } };

// céu frio e baixo (as sombras ficam lilases), sol quente forte vindo de trás
scene.add(new THREE.HemisphereLight("#b9c8f0", "#4f6a30", .65));
const sunLight = new THREE.DirectionalLight("#ffb46b", 5.2);
sunLight.position.set(SUN_DIR.x * 70 + 2, 24, SUN_DIR.z * 70 - 6);
sunLight.target.position.set(2, 0, -6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(4096, 4096);
Object.assign(sunLight.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 160 });
sunLight.shadow.bias = -.0004; sunLight.shadow.normalBias = .03;
scene.add(sunLight, sunLight.target);
const fill = new THREE.DirectionalLight("#b8c4e8", 1.1); fill.position.set(-10, 10, 30); scene.add(fill);

// =====================================================================
// CÉU
// =====================================================================
const GLSL_NOISE = `
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ float s = 0., a = .5; for(int i = 0; i < 6; i++){ s += a * vnoise(p); p = p * 2.03 + 1.7; a *= .5; } return s; }
float fbm4(vec2 p){ float s = 0., a = .5; for(int i = 0; i < 4; i++){ s += a * vnoise(p); p = p * 2.03 + 1.7; a *= .5; } return s / .9375; }`;
const sky = new THREE.Mesh(new THREE.SphereGeometry(1200, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTime: U.time, sunDir: { value: SUN_DIR } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `
    varying vec3 vDir; uniform vec3 sunDir; uniform float uTime; ${GLSL_NOISE}
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 hor = vec3(.91,.76,.59), mid = vec3(.93,.7,.52), top = vec3(.48,.6,.86);
      vec3 col = mix(hor, mid, smoothstep(.04, .2, h));
      col = mix(col, top, smoothstep(.15, .7, h));
      col = mix(col, hor, smoothstep(.04, -.05, h));
      col = pow(col, vec3(2.2));
      float s = max(dot(d, sunDir), 0.);
      col += vec3(1., .55, .22) * pow(s, 5.) * .9 + vec3(1., .78, .45) * pow(s, 50.) * 1.6;
      col = mix(col, vec3(12., 9.5, 6.), smoothstep(.99955, .9998, s));
      if (h > 0.) {
        vec2 uv = d.xz / (h + .12) * .55 + vec2(uTime * .006, uTime * .002);
        float c = smoothstep(.5, .85, fbm(uv * 1.3)) * smoothstep(.05, .25, h);
        vec3 cc = pow(vec3(1., .78, .6), vec3(2.2)) + vec3(1., .5, .2) * pow(s, 4.) * 1.5;
        col = mix(col, cc, c * .7);
      }
      gl_FragColor = vec4(col, 1.);
    }`
}));
sky.renderOrder = -1;
scene.add(sky);

// =====================================================================
// TEXTURAS PROCEDURAIS
// =====================================================================
function canvasTex(size, draw, { srgb = true, repeat = 1 } = {}) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; t.repeat.set(repeat, repeat);
  return t;
}
function pixels(x, s, fn) {
  const img = x.createImageData(s, s);
  for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) { const c = fn(i, j), k = (j * s + i) * 4; img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = c[3] ?? 255; }
  x.putImageData(img, 0, 0);
}

// reboco envelhecido no estilo da base: liso e fosco, granulação fina,
// manchas suaves de umidade, pequenas lascas, escorrido vertical e musgo
// discreto. Mapa NORMAL calculado da altura para um relevo sutil sob a luz rasante.
const S = 768, stoneHeight = new Float32Array(S * S);
const stoneMap = canvasTex(S, (x) => pixels(x, S, (i, j) => {
  const u = i / S, v = j / S;
  const big = pfbm(u * 3, v * 3, 3, 3), mid = pfbm(u * 12, v * 12, 12, 12, 3), fine = pfbm(u * 64, v * 64, 64, 64, 2);
  const streak = smooth(.58, .82, pfbm(u * 20, v * 2, 20, 2, 3));                  // escorrido vertical
  const damp = smooth(.55, .78, pfbm(u * 5 + .7, v * 5, 5, 5, 4));                   // manchas de umidade
  const chips = smooth(.7, .78, pfbm(u * 28 + 3, v * 28, 28, 28, 3));               // reboco lascado
  const moss = smooth(.66, .8, pfbm(u * 6 + 1.3, v * 6, 6, 6, 4)) * (.4 + fine * .8);
  const m = (.9 + (big - .5) * .14 + (mid - .5) * .1 + (fine - .5) * .06) * (1 - streak * .14) * (1 - damp * .12);
  let col = [236 * m, 214 * m, 184 * m];
  col = col.map((q, n) => q + ([214, 178, 140][n] * (.85 + mid * .2) - q) * chips * .8);   // camada de baixo exposta
  col = col.map((q, n) => q + ([118, 138, 72][n] * (.75 + fine * .5) - q) * moss * .7);
  stoneHeight[j * S + i] = .5 + (mid - .5) * .25 + (fine - .5) * .18 - chips * .22 + moss * .05;
  return col;
}));
const stoneBump = canvasTex(S, (x) => pixels(x, S, (i, j) => {
  const hx = stoneHeight[j * S + md(i + 1, S)] - stoneHeight[j * S + md(i - 1, S)];
  const hy = stoneHeight[md(j + 1, S) * S + i] - stoneHeight[md(j - 1, S) * S + i];
  const n = new THREE.Vector3(-hx * 6, hy * 6, 1).normalize();
  return [(n.x * .5 + .5) * 255, (n.y * .5 + .5) * 255, (n.z * .5 + .5) * 255];
}), { srgb: false });
stoneMap.repeat.set(.18, .18); stoneBump.repeat.set(.18, .18);

// casca de árvore: fibras verticais com fendas
const barkTex = canvasTex(256, (x) => pixels(x, 256, (i, j) => {
  const u = i / 256, v = j / 256, f = pfbm(u * 8, v * 2, 8, 2, 4), crack = 1 - Math.abs(pfbm(u * 6, v, 6, 1, 3) * 2 - 1);
  const m = (.55 + f * .6) * (crack > .88 ? .45 : 1);
  return [104 * m, 84 * m, 66 * m];
}));
barkTex.repeat.set(2, 3);

// folha: degradê, nervura central e laterais (cor final vem da instância)
const leafTex = canvasTex(128, (x) => {
  x.save(); x.beginPath(); x.moveTo(64, 4); x.bezierCurveTo(122, 40, 104, 104, 64, 124); x.bezierCurveTo(24, 104, 6, 40, 64, 4); x.clip();
  const g = x.createRadialGradient(56, 60, 4, 64, 64, 70); g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#a9a99e");
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  x.strokeStyle = "rgba(255,255,240,.85)"; x.lineWidth = 2.5; x.beginPath(); x.moveTo(64, 8); x.lineTo(64, 122); x.stroke();
  x.lineWidth = 1.2; x.strokeStyle = "rgba(255,255,240,.45)";
  for (let k = 0; k < 7; k++) { const y = 26 + k * 13; x.beginPath(); x.moveTo(64, y); x.quadraticCurveTo(80, y - 4, 96 - k * 3, y - 14); x.moveTo(64, y); x.quadraticCurveTo(48, y - 4, 32 + k * 3, y - 14); x.stroke(); }
  for (let k = 0; k < 40; k++) { x.fillStyle = `rgba(80,70,40,${rand(.05, .2)})`; x.beginPath(); x.arc(rand(20, 108), rand(10, 120), rand(.5, 2), 0, 7); x.fill(); }
  x.restore();
});

// vitória-régia: veias radiais, borda avermelhada, recorte em V e manchas
const padTex = canvasTex(256, (x) => {
  const g = x.createRadialGradient(128, 128, 4, 128, 128, 124);
  g.addColorStop(0, "#b9d38e"); g.addColorStop(.5, "#7aa04e"); g.addColorStop(.92, "#557a36"); g.addColorStop(1, "#7a4a2e");
  x.fillStyle = g; x.beginPath(); x.arc(128, 128, 124, 0, 7); x.fill();
  x.strokeStyle = "rgba(220,235,180,.35)"; x.lineWidth = 1.5;
  for (let k = 0; k < 28; k++) { const a = k / 28 * Math.PI * 2; x.beginPath(); x.moveTo(128, 128); x.quadraticCurveTo(128 + Math.cos(a + .1) * 60, 128 + Math.sin(a + .1) * 60, 128 + Math.cos(a) * 120, 128 + Math.sin(a) * 120); x.stroke(); }

function windify(mat, { amp = .3, height = 1, flat = false, blade = false, glow = 0, trans = 0, key = "w" } = {}) {

    sh.uniforms.uTime = U.time; sh.uniforms.uSunView = U.sunView;
    sh.vertexShader = "uniform float uTime;\nvarying float vH;\nvarying float vTip;\nvarying float vScat;\n" + sh.vertexShader
      .replace("#include <begin_vertex>", `#include <begin_vertex>
        vH = ${flat ? "1.0" : `clamp(position.y / ${height.toFixed(3)}, 0., 1.)`};
        vTip = 0.;
        #ifdef USE_INSTANCING
          vTip = fract(sin(dot(instanceMatrix[3].xz, vec2(12.9898, 78.233))) * 43758.5453);
        #endif`)
      .replace("#include <project_vertex>", `
        vec4 wp = vec4(transformed, 1.);
        #ifdef USE_INSTANCING
          wp = instanceMatrix * wp;
        #endif
        wp = modelMatrix * wp;
        float k = vH * vH;
        float gust = sin(wp.x * .11 + wp.z * .06 + uTime * 1.15) * .5 + .5;
        gust *= sin(wp.x * .031 - uTime * .37) * .35 + .65;
        float flutter = sin(uTime * 3.3 + wp.x * 1.7 + wp.z * 2.3) * .3 + sin(uTime * 5.1 + wp.z * 3.1) * .12;
        wp.x += (gust * .9 + flutter + .15) * k * ${amp.toFixed(3)};
        wp.z += (flutter * .6 - gust * .25) * k * ${amp.toFixed(3)};
        wp.y -= gust * k * ${(amp * .25).toFixed(3)};
        vScat = pow(max(dot(normalize(wp.xyz - cameraPosition), vec3(${sd})), 0.), 3.);
        vec4 mvPosition = viewMatrix * wp;
        gl_Position = projectionMatrix * mvPosition;`);
    sh.fragmentShader = "varying float vH;\nvarying float vTip;\nvarying float vScat;\n" + sh.fragmentShader;
    if (blade) sh.fragmentShader = sh.fragmentShader.replace("#include <color_fragment>", `#include <color_fragment>
      diffuseColor.rgb *= mix(.28, 1.1, vH);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.62, .44, .17), smoothstep(.55, 1., vH) * smoothstep(.45, 1., vTip) * .85);`);
    sh.fragmentShader = sh.fragmentShader.replace("#include <emissivemap_fragment>", `#include <emissivemap_fragment>
      float scat = vScat;
      totalEmissiveRadiance += diffuseColor.rgb * vec3(1., .62, .3) * (${glow.toFixed(3)} + scat * ${trans.toFixed(3)}) * ${blade ? "pow(vH, 1.5)" : "1."};`);
  };
  mat.customProgramCacheKey = () => `${key}-${amp}-${height}-${flat}-${blade}-${glow}-${trans}`;
  return mat;
}

scene.add(petals);
const PN2 = 600, pg = new THREE.BufferGeometry(), pa = new Float32Array(PN2 * 3), seeds = new Float32Array(PN2);
for (let i = 0; i < PN2; i++) { pa.set([rand(-20, 22), rand(0, 10), rand(-20, 12)], i * 3); seeds[i] = rand(0, 10); }
pg.setAttribute("position", new THREE.BufferAttribute(pa, 3));
const pollen = new THREE.Points(pg, new THREE.PointsMaterial({ map: glowTex, color: "#ffd890", size: .2, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
scene.add(pollen);

// =====================================================================
// PÓS: god rays fortes, bloom, grade dourado, vinheta, grão
// =====================================================================
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// higieniza o HDR: NaN/Inf de qualquer pixel viravam manchas pretas ao passar pelo bloom
composer.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); if (any(isnan(c)) || any(isinf(c))) c = vec4(.6, .45, .3, 1.); gl_FragColor = vec4(clamp(c.rgb, 0., 30.), 1.); }` }));
const godRays = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, sunPos: { value: new THREE.Vector2(.6, .5) }, strength: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 sunPos; uniform float strength; varying vec2 vUv;
    void main(){
      vec4 base = texture2D(tDiffuse, vUv);
      vec2 delta = (vUv - sunPos) / 80.; vec2 uv = vUv; float decay = 1.; vec3 acc = vec3(0.);
      for (int i = 0; i < 80; i++) {
        uv -= delta; vec3 s = texture2D(tDiffuse, uv).rgb;
        // só o que está acima da linha do sol emite raios (a água não "escorre" em faixas)
        acc += s * max(dot(s, vec3(.3, .59, .11)) - 1.1, 0.) * decay * smoothstep(sunPos.y - .22, sunPos.y - .04, uv.y); decay *= .968;
      }
      gl_FragColor = vec4(base.rgb + acc * strength * vec3(1., .74, .42), base.a);
    }`
});
composer.addPass(godRays);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), .22, .7, 1.4);
composer.addPass(bloom);
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: U.time },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    float rnd(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - .5; float r = dot(c, c); float ca = .006 * r;
      vec3 col = vec3(texture2D(tDiffuse, vUv + c * ca).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - c * ca).b);
      col *= 1. - r * .9;
      float lum = dot(col, vec3(.2126, .7152, .0722));
      col = mix(vec3(lum), col, 1.32);                       // mais saturação
      col = mix(col, col * vec3(1.06, .99, .9), .45) + vec3(.008, .005, 0.);
      col += (rnd(vUv * vec2(1731., 977.) + fract(uTime * 7.)) - .5) * .05 * (col + .06);
      gl_FragColor = vec4(max(col, 0.), 1.);
    }`
}));
composer.addPass(new OutputPass());

// =====================================================================
// INTERAÇÃO + INTRO
// =====================================================================
const mouse = { x: 0, y: 0 }, cur = { x: innerWidth / 2, y: innerHeight / 2 }, cursor = document.querySelector(".cursor");
let started = false, dolly = 0, dollyT = 0;
addEventListener("mousemove", ev => { mouse.x = ev.clientX / innerWidth - .5; mouse.y = ev.clientY / innerHeight - .5; cur.x = ev.clientX; cur.y = ev.clientY; });
document.querySelectorAll("a,button,.palette span").forEach(el => {
  el.addEventListener("mouseenter", () => cursor.classList.add("big"));
  el.addEventListener("mouseleave", () => cursor.classList.remove("big"));
});
addEventListener("wheel", ev => { if (started) dollyT = THREE.MathUtils.clamp(dollyT + ev.deltaY * .001, 0, 1); });

const word = "BLOOM", letterEl = document.getElementById("letter");
let li = 0;
const tick = setInterval(() => { letterEl.textContent = word[li++ % word.length]; }, 150);
setTimeout(() => {
  clearInterval(tick); letterEl.style.display = "none";
  document.getElementById("sunrise").style.display = "block";
  gsap.fromTo(".sunrise i", { yPercent: 100 }, { yPercent: 15, duration: 1.4, ease: "expo.out" });
  gsap.to("#enter", { opacity: 1, duration: .6, delay: .5 });
  document.getElementById("status").textContent = `${gn.toLocaleString()} folhas de grama · ${fl.toLocaleString()} flores`;
}, 1700);
document.getElementById("enter").onclick = () => {
  started = true;
  gsap.timeline()
    .to("#intro", { clipPath: "inset(0 0 100% 0)", duration: 1.2, ease: "expo.inOut" })
    .to(camera.position, { z: 15, duration: 3, ease: "expo.out" }, .3)
    .set(".ui", { opacity: 1 }, .9)
    .from(".hero .mask>span", { yPercent: 110, duration: 1.2, stagger: .1, ease: "expo.out" }, 1)
    .from(".cta,header,footer", { opacity: 0, y: 14, duration: 1, stagger: .1, ease: "expo.out" }, 1.3)
    .from(".palette span", { scale: 0, duration: .6, stagger: .05, ease: "back.out(2)" }, 1.6)
    .set("#intro", { display: "none" });
};

// =====================================================================
// LOOP
// =====================================================================
const sm = { x: 0, y: 0 };
const clock = new THREE.Clock(), look = new THREE.Vector3(), hero = document.querySelector(".hero"), sunScreen = new THREE.Vector3(), dummy = new THREE.Object3D();
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  U.time.value = t;
  water.material.uniforms.uTime.value = t;

  fogCards.forEach(c => { const d = c.userData.drift; if (d) c.position.x = d.x + Math.sin(t * d.f + d.ph) * d.amp; });
  trees.forEach((tr, i) => { tr.rotation.z = Math.sin(t * .7 + i) * .008; tr.rotation.x = Math.sin(t * .5 + i * 2) * .005; });
  butterflies.forEach(b => {
    const d = b.userData, tt = t * d.sp * .35 + d.ph;
    const nx = d.cx + Math.sin(tt) * d.rx, nz = d.cz + Math.sin(tt * 1.37) * d.rz, ny = d.y + Math.sin(t * 1.9 + d.ph) * .35 + H(nx, nz) * .5;
    b.lookAt(nx, ny, nz); b.position.set(nx, ny, nz);
    const f = Math.sin(t * 19 + d.ph) * 1.05; d.R.rotation.z = f; d.L.rotation.z = -f;
  });
  birds.forEach(b => {
    const d = b.userData, lx = ((t * 3.2) % 260) - 130;
    b.position.set(lx + d.off.x, 22 + d.off.y + Math.sin(t * .6 + d.ph) * .4, -110 + d.off.z);
    b.rotation.y = -Math.PI / 2;
    const f = Math.sin(t * 7 + d.ph) * .6; d.R.rotation.z = f; d.L.rotation.z = -f;
  });
  petalData.forEach((p, i) => {
    p.p.y -= dt * .5 * p.s; p.p.x += dt * (.5 + Math.sin(t + i) * .4); p.p.z += Math.sin(t * .8 + i) * dt * .3; p.r += dt * 2 * p.s;
    if (p.p.y < Math.max(H(p.p.x, p.p.z), 0) + .02) p.p.set(12.5 + rand(-2.5, 2.5), rand(5, 9), -11 + rand(-2.5, 2.5));
    dummy.position.copy(p.p); dummy.rotation.set(p.r, p.r * .7, p.r * 1.3); dummy.updateMatrix(); petals.setMatrixAt(i, dummy.matrix);
  });
  petals.instanceMatrix.needsUpdate = true;
  const pp = pg.attributes.position.array;
  for (let i = 0; i < PN2; i++) {
    pp[i * 3 + 1] += dt * (.18 + Math.sin(t + seeds[i]) * .1);
    pp[i * 3] += Math.sin(t * .4 + seeds[i]) * dt * .25;
    pp[i * 3 + 2] += Math.cos(t * .3 + seeds[i]) * dt * .2;
    if (pp[i * 3 + 1] > 10) pp[i * 3 + 1] = .2;
  }
  pg.attributes.position.needsUpdate = true;

  // câmera no estilo da base: segue o mouse com muita inércia, flutua sozinha
  // devagar (como se estivesse na água), e a mira acompanha um pouco o mouse
  sm.x += (mouse.x - sm.x) * .025; sm.y += (mouse.y - sm.y) * .025;
  const fx = Math.sin(t * .21) * .55 + Math.sin(t * .53 + 1.3) * .18, fy = Math.sin(t * .33 + .7) * .22 + Math.sin(t * .71) * .06;
  if (started) {
    dolly += (dollyT - dolly) * .035;
    if (!gsap.isTweening(camera.position)) camera.position.z = 15 - dolly * 9 + Math.sin(t * .17) * .6;
    camera.position.x += (sm.x * 3.2 + fx + dolly * 2.5 - camera.position.x) * .05;
    camera.position.y += (2.7 - sm.y * 1.1 + fy + dolly * .3 - camera.position.y) * .05;
    hero.style.opacity = 1 - dolly * 1.8;
  }
  look.set(2.5 + dolly * 3 + sm.x * 1.6 + Math.sin(t * .27) * .35, 2.6 - sm.y * .7 + Math.sin(t * .41) * .12, -10);
  camera.lookAt(look);
  camera.rotateZ(-sm.x * .03 + Math.sin(t * .29) * .006);   // leve inclinação, como câmera na mão
  sky.position.copy(camera.position);
  camera.updateMatrixWorld();
  U.sunView.value.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse);

  sunScreen.copy(camera.position).addScaledVector(SUN_DIR, 500).project(camera);
  godRays.uniforms.sunPos.value.set(sunScreen.x * .5 + .5, sunScreen.y * .5 + .5);
  const onScreen = sunScreen.z < 1 ? Math.max(0, 1 - Math.max(Math.abs(sunScreen.x), Math.abs(sunScreen.y)) / 1.8) : 0;
  godRays.uniforms.strength.value = .06 * onScreen;

  cursor.style.transform = `translate(${cur.x}px,${cur.y}px)`;

  // profundidade só dos opacos → partículas suaves de névoa
  const hidden = [...fogCards, water, pollen, sky], au = renderer.shadowMap.autoUpdate;
  hidden.forEach(o => o.visible = false); renderer.shadowMap.autoUpdate = false;
  scene.overrideMaterial = depthMat; renderer.setRenderTarget(depthRT); renderer.clear(); renderer.render(scene, camera);
  scene.overrideMaterial = null; renderer.setRenderTarget(null);
  hidden.forEach(o => o.visible = true); renderer.shadowMap.autoUpdate = au;

  composer.render();
  requestAnimationFrame(frame);
}
frame();

// atalho de depuração: window.__meadow.skipIntro() pula a intro
window.__meadow = { frame, camera, composer, renderer, scene, skipIntro() { started = true; gsap.globalTimeline.progress(1); gsap.set("#intro", { display: "none" }); gsap.set(".ui", { opacity: 1 }); camera.position.set(0, 2.7, 15); } };

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth / 2, innerHeight / 2);
  sizeDepth();
});
</script>
</body>
</html>
